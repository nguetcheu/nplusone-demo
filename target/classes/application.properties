spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Compte les requêtes SQL r�ellement envoy�s
spring.jpa.properties.hibernate.generate_statistics=true

# Acc�l�re l'insertion des données de test
spring.jpa.properties.hibernate.jdbc.batch_size=50
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
spring.jpa.properties.hibernate.order_inserts=true

# Laisse false avec 10 000 portefeuilles (la console serait inond�e).
